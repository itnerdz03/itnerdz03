<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rust-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust Server Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
      }
      /* Loading screen */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      }
      .loading-screen .logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        animation: pulse 2s infinite;
      }
      .loading-screen .title {
        font-size: 24px;
        font-weight: 600;
        color: #cd2417;
        margin-bottom: 16px;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #333;
        border-top: 3px solid #cd2417;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="#cd2417" stroke-width="4" fill="none"/>
          <path d="M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z" fill="#cd2417" opacity="0.8"/>
          <path d="M50 25 L50 75" stroke="#fff" stroke-width="2"/>
          <path d="M30 35 L70 65" stroke="#fff" stroke-width="2"/>
          <path d="M70 35 L30 65" stroke="#fff" stroke-width="2"/>
        </svg>
        <div class="title">Rust Server Manager</div>
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
